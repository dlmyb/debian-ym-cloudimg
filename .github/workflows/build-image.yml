name: Build Debian 13 amd64 Cloud Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils curl jq xz-utils

      - name: Materialize inputs
        shell: bash
        run: |
          mkdir -p files out
          printf '%s\n' "${{ secrets.ROOT_PUBKEY }}" > root.pub
          cat > files/99-root-login.cfg <<'EOF'
          #cloud-config
          disable_root: false
          ssh_pwauth: false
          users: [root]
          system_info:
            default_user:
              name: root
              lock_passwd: true
              gecos: root
              groups: [adm, sudo]
              shell: /bin/bash
              homedir: /root
          EOF
          chmod 600 root.pub

      - name: Build image
        shell: bash
        run: |
          chmod +x build-image.sh
          ./build-image.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-13-amd64-cloudimg
          path: |
            out/*.qcow2.xz
            out/*.qcow2.xz.sha256